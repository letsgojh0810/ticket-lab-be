# 부하 테스트용 프로필: 실행 인자 --spring.profiles.active=loadtest (IntelliJ의 Active profiles에 loadtest)
# 개발용 application.properties 의 SQL 로그 설정은 그대로 두고, 이 프로필에서만 덮어쓴다.

# SQL 로그 끄기 (부하 중 콘솔 I/O 병목 방지)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# 인증 요청마다 users 조회가 있어 기본 풀(10)이 먼저 고갈된다
spring.datasource.hikari.maximum-pool-size=50

# @Scheduled 가 기본 1스레드를 공유해 한 작업이 느리면 대기열 입장이 멈춘다
spring.task.scheduling.pool.size=4

# 테스트가 15분을 넘겨도 토큰 만료로 403이 몰리지 않게
jwt.access-token-expiry=3600000
